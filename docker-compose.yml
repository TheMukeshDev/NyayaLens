services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nyayalens-postgres
    environment:
      POSTGRES_USER: nyayalens
      POSTGRES_PASSWORD: nyayalens
      POSTGRES_DB: nyayalens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyayalens -d nyayalens"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data: