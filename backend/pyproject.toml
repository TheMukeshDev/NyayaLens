[project]
name = "nyayalens-backend"
version = "0.1.0"
description = "NyayaLens FastAPI backend (Supabase-native)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.5",
    "supabase>=2.7",
    "pyjwt>=2.10",
    "email-validator>=2.2",
    "httpx>=0.27",
    # Document processing pipeline (system-architecture.md §19).
    "pypdf>=5.0",
    "python-docx>=1.1",
    "pillow>=10.4",
    # OCR integration. Pure-Python wrapper; the tesseract binary itself must be
    # installed on the host (backend/.env.example: OCR_TESSERACT_CMD). The
    # pipeline never fabricates OCR text when the binary is missing — it fails
    # the document with a recorded, retryable error instead.
    "pytesseract>=0.3",
]

[project.optional-dependencies]
# ASGI server for local development and any long-lived (non-serverless) host.
# It is deliberately NOT a runtime dependency: the Vercel function serves the
# app through the ASGI bridge in ``api/`` and never needs an HTTP server, and
# ``uvicorn[standard]`` would add compiled extras to the serverless bundle.
serve = [
    "uvicorn[standard]>=0.30",
]
dev = [
    "uvicorn[standard]>=0.30",
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "B008", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true